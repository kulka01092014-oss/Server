  <body>
    <nav>
      <a href="/" aria-current="page">Home</a>
      <a href="/page2.html">Other page</a>

    <header>
    <div class="header-title">
        <i class="fas fa-trophy"></i>
    </div>
    <div class="header-subtitle"> Our server
        <p>Our server address will be displayed once you have filled in all the details</p>
        <p class="highlight-text">Join us and you will be happy!)</p>
    </div>
</header>

<main>

    <div class="form-card" href="page2.html">
        <h2>Player Registration</h2>
        <form action="#">
            
            <div class="form-group">
                <label>Player Name</label>
                <div class="input-wrapper">
                    <i class="far fa-user"></i>
                    <input type="text" placeholder="Enter your name" required>
                </div>
            </div>


            <div class="form-group">
                <label>Enter the reason why you want to enter</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope"></i>
                    <input type="" placeholder="Why you want to enter" required>
                </div>
            </div>

            <div class="form-group">
                <label>Game ID / Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-gamepad"></i>
                    <input type="text" placeholder="Your in-game ID" required>
                </div>
            </div>

            <div class="form-group">
                <label>Team Name (Optional)</label>
                <div class="input-wrapper">
                    <i class="fas fa-users"></i>
                    <input type="text" placeholder="Your team name">
                </div>
            </div>

            <button href="page2.html" type="submit" class="submit-btn"> <a href="page2.html"> Register Now</button>

        </form>
    </div>
</main>

<footer>
     
      
        <div class="contact-item">
            <h4><i class="fas fa-map-marker-alt"></i> Location</h4>

    <div class="discord-bar">
